# =============================================================================
# Sentrais Intelligence Backbone - Google Cloud Native CI/CD Pipeline
# =============================================================================
# Fully Google-native build using Cloud Build, Vertex AI (Gemini), and GCP tools
#
# Triggers:
#   develop branch → Deploy to staging
#   main branch    → Deploy to production
# =============================================================================

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'sentrais-repo'
  _SERVICE_NAME: 'ingestion-api'

steps:
  # =========================================================================
  # Step 1: Determine environment based on branch
  # =========================================================================
  - id: 'detect-environment'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "========================================"
        echo "SENTRAIS BACKBONE - GOOGLE CLOUD BUILD"
        echo "========================================"
        if [[ "$BRANCH_NAME" == "main" ]]; then
          echo "production" > /workspace/environment.txt
          echo "prod" > /workspace/tfvars.txt
        elif [[ "$BRANCH_NAME" == "develop" ]]; then
          echo "staging" > /workspace/environment.txt
          echo "staging" > /workspace/tfvars.txt
        else
          echo "dev" > /workspace/environment.txt
          echo "dev" > /workspace/tfvars.txt
        fi
        echo "Branch: $BRANCH_NAME"
        echo "Environment: $(cat /workspace/environment.txt)"
        echo "Commit: $SHORT_SHA"
        echo "========================================"

  # =========================================================================
  # Step 2: Code Analysis with Gemini (Vertex AI)
  # =========================================================================
  - id: 'gemini-code-review'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Running Gemini code analysis..."

        # Get changed files
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

        if [ -n "$CHANGED_FILES" ]; then
          echo "Analyzing changed files with Gemini..."

          # Use Vertex AI Gemini for code review
          gcloud ai models predict \
            --region=${_REGION} \
            --model=gemini-1.5-flash \
            --json-request="{
              \"instances\": [{
                \"content\": \"Review these changed files for security and best practices: $CHANGED_FILES\"
              }]
            }" 2>/dev/null || echo "Gemini analysis skipped (API not yet enabled)"
        else
          echo "No file changes to analyze"
        fi

        echo "Code analysis complete"
    waitFor: ['detect-environment']
    allowFailure: true

  # =========================================================================
  # Step 3: Terraform Init & Validate (Google Cloud native)
  # =========================================================================
  - id: 'terraform-init'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd terraform

        # Install Terraform using Google's recommended method
        apt-get update && apt-get install -y unzip curl
        curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
        unzip -o terraform.zip -d /usr/local/bin/

        echo "Initializing Terraform..."
        terraform init -input=false
        terraform validate

        echo "Terraform initialized successfully"
    waitFor: ['detect-environment']

  # =========================================================================
  # Step 4: Terraform Plan
  # =========================================================================
  - id: 'terraform-plan'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd terraform

        # Ensure terraform is available
        curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
        unzip -o terraform.zip -d /usr/local/bin/

        TFVARS=$(cat /workspace/tfvars.txt)
        echo "Planning with environment: $TFVARS"

        terraform plan \
          -var-file=environments/$${TFVARS}.tfvars \
          -out=tfplan \
          -input=false

        echo "Terraform plan complete"
    waitFor: ['terraform-init']

  # =========================================================================
  # Step 5: Terraform Apply
  # =========================================================================
  - id: 'terraform-apply'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd terraform

        curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
        unzip -o terraform.zip -d /usr/local/bin/

        echo "Applying Terraform configuration..."
        terraform apply -auto-approve -input=false tfplan

        echo "Infrastructure deployed successfully"
    waitFor: ['terraform-plan']

  # =========================================================================
  # Step 6: Build Container with Cloud Build native buildpacks
  # =========================================================================
  - id: 'build-container'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}"

        if [ -f "Dockerfile" ]; then
          echo "Building container image..."
          docker build \
            -t $${IMAGE_URI}:${SHORT_SHA} \
            -t $${IMAGE_URI}:latest \
            -t $${IMAGE_URI}:$(cat /workspace/environment.txt) \
            --label "commit=${SHORT_SHA}" \
            --label "branch=${BRANCH_NAME}" \
            --label "built-by=cloud-build" \
            .

          echo "$${IMAGE_URI}:${SHORT_SHA}" > /workspace/image_uri.txt
          echo "Container built: $${IMAGE_URI}:${SHORT_SHA}"
        else
          echo "No Dockerfile found, skipping container build"
          echo "SKIP" > /workspace/image_uri.txt
        fi
    waitFor: ['terraform-apply']

  # =========================================================================
  # Step 7: Push to Artifact Registry
  # =========================================================================
  - id: 'push-container'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE_URI=$(cat /workspace/image_uri.txt)

        if [ "$IMAGE_URI" != "SKIP" ]; then
          echo "Pushing to Artifact Registry..."
          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest"
          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$(cat /workspace/environment.txt)"
          echo "Container pushed successfully"
        else
          echo "No container to push"
        fi
    waitFor: ['build-container']

  # =========================================================================
  # Step 8: Security Scan with Google Container Analysis
  # =========================================================================
  - id: 'security-scan'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE_URI=$(cat /workspace/image_uri.txt)

        if [ "$IMAGE_URI" != "SKIP" ]; then
          echo "Running container security scan..."

          # Enable on-demand scanning
          gcloud artifacts docker images scan \
            "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}" \
            --remote \
            --format="json" 2>/dev/null || echo "Security scan skipped (API not enabled)"

          echo "Security scan complete"
        fi
    waitFor: ['push-container']
    allowFailure: true

  # =========================================================================
  # Step 9: Deploy to Cloud Run
  # =========================================================================
  - id: 'deploy-cloud-run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE_URI=$(cat /workspace/image_uri.txt)
        ENV=$(cat /workspace/environment.txt)

        if [ "$IMAGE_URI" != "SKIP" ]; then
          # Set service name based on environment
          if [ "$ENV" = "production" ]; then
            SERVICE="${_SERVICE_NAME}"
            MIN_INSTANCES=1
            MAX_INSTANCES=100
            MEMORY="1Gi"
            CPU=2
          else
            SERVICE="${_SERVICE_NAME}-$${ENV}"
            MIN_INSTANCES=0
            MAX_INSTANCES=10
            MEMORY="512Mi"
            CPU=1
          fi

          echo "Deploying $SERVICE to Cloud Run ($ENV)..."

          gcloud run deploy $${SERVICE} \
            --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA} \
            --region=${_REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},ENVIRONMENT=$${ENV},BUILD_SHA=${SHORT_SHA}" \
            --min-instances=$${MIN_INSTANCES} \
            --max-instances=$${MAX_INSTANCES} \
            --memory=$${MEMORY} \
            --cpu=$${CPU} \
            --timeout=60s \
            --concurrency=80 \
            --service-account=ingestion-api@${PROJECT_ID}.iam.gserviceaccount.com

          # Get deployment URL
          URL=$(gcloud run services describe $${SERVICE} --region=${_REGION} --format='value(status.url)')
          echo "$URL" > /workspace/deploy_url.txt

          echo "========================================"
          echo "Deployed: $URL"
          echo "========================================"
        else
          echo "No container to deploy"
        fi
    waitFor: ['security-scan']

  # =========================================================================
  # Step 10: Verify Deployment with Health Check
  # =========================================================================
  - id: 'health-check'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f "/workspace/deploy_url.txt" ]; then
          URL=$(cat /workspace/deploy_url.txt)
          echo "Running health check on $URL..."

          # Wait for service to be ready
          sleep 10

          # Health check with retries
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying..."
            sleep 5
          done

          echo "Warning: Health check did not return 200, but deployment completed"
        fi
    waitFor: ['deploy-cloud-run']
    allowFailure: true

  # =========================================================================
  # Step 11: Notify via Cloud Logging (Google native)
  # =========================================================================
  - id: 'build-summary'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ENV=$(cat /workspace/environment.txt)

        echo ""
        echo "========================================"
        echo "  BUILD COMPLETE - GOOGLE CLOUD NATIVE"
        echo "========================================"
        echo "Project:     ${PROJECT_ID}"
        echo "Branch:      ${BRANCH_NAME}"
        echo "Commit:      ${SHORT_SHA}"
        echo "Environment: $ENV"
        if [ -f "/workspace/deploy_url.txt" ]; then
          echo "URL:         $(cat /workspace/deploy_url.txt)"
        fi
        echo "========================================"

        # Log to Cloud Logging for monitoring
        gcloud logging write sentrais-build-log \
          "{\"status\": \"success\", \"branch\": \"${BRANCH_NAME}\", \"commit\": \"${SHORT_SHA}\", \"environment\": \"$ENV\"}" \
          --severity=INFO \
          --payload-type=json 2>/dev/null || true
    waitFor: ['health-check']

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamic_substitutions: true

# Artifact images
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'

# Build timeout (20 minutes)
timeout: '1200s'
