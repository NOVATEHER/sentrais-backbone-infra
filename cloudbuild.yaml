# =============================================================================
# Sentrais Intelligence Backbone - Automated CI/CD Pipeline
# =============================================================================
# Triggers:
#   develop branch → Deploy to staging
#   main branch    → Deploy to production (with Terraform)
# =============================================================================

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'sentrais-repo'

steps:
  # =========================================================================
  # Step 1: Determine environment based on branch
  # =========================================================================
  - id: 'set-environment'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "$BRANCH_NAME" == "main" ]]; then
          echo "production" > /workspace/environment.txt
          echo "prod" > /workspace/tfvars.txt
        else
          echo "staging" > /workspace/environment.txt
          echo "staging" > /workspace/tfvars.txt
        fi
        echo "========================================"
        echo "Branch: $BRANCH_NAME"
        echo "Environment: $(cat /workspace/environment.txt)"
        echo "========================================"

  # =========================================================================
  # Step 2: Terraform - Infrastructure as Code
  # =========================================================================
  - id: 'terraform-init'
    name: 'hashicorp/terraform:1.5'
    dir: 'terraform'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform init -input=false
        terraform validate
    waitFor: ['set-environment']

  - id: 'terraform-plan'
    name: 'hashicorp/terraform:1.5'
    dir: 'terraform'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        TFVARS=$(cat /workspace/tfvars.txt)
        terraform plan \
          -var-file=environments/$${TFVARS}.tfvars \
          -out=tfplan \
          -input=false
    waitFor: ['terraform-init']

  - id: 'terraform-apply'
    name: 'hashicorp/terraform:1.5'
    dir: 'terraform'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform apply -auto-approve -input=false tfplan
    waitFor: ['terraform-plan']

  # =========================================================================
  # Step 3: Build Docker image (if Dockerfile exists)
  # =========================================================================
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f "services/ingestion_api/Dockerfile" ]; then
          echo "Building Docker image..."
          docker build \
            -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ingestion-api:${SHORT_SHA} \
            -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ingestion-api:latest \
            -f services/ingestion_api/Dockerfile \
            services/ingestion_api
        else
          echo "No Dockerfile found, skipping build..."
        fi
    waitFor: ['terraform-apply']

  # =========================================================================
  # Step 4: Push Docker image to Artifact Registry
  # =========================================================================
  - id: 'push-image'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f "services/ingestion_api/Dockerfile" ]; then
          echo "Pushing Docker image..."
          docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ingestion-api:${SHORT_SHA}
          docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ingestion-api:latest
          echo "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ingestion-api:${SHORT_SHA}" > /workspace/image.txt
        else
          echo "No image to push, skipping..."
        fi
    waitFor: ['build-image']

  # =========================================================================
  # Step 5: Deploy to Cloud Run (Staging)
  # =========================================================================
  - id: 'deploy-staging'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ENV=$(cat /workspace/environment.txt)
        if [ -f "/workspace/image.txt" ] && [ "$$ENV" = "staging" ]; then
          IMAGE=$(cat /workspace/image.txt)
          echo "Deploying to staging..."
          gcloud run deploy ingestion-api-staging \
            --image=$$IMAGE \
            --region=${_REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},BQ_DATASET_ID=sentrais_backbone,ENVIRONMENT=staging,PUBSUB_TOPIC=sentrasignal-ingestion-staging" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60s \
            --concurrency=80 \
            --service-account=ingestion-api@${PROJECT_ID}.iam.gserviceaccount.com

          # Get and display URL
          URL=$(gcloud run services describe ingestion-api-staging --region=${_REGION} --format='value(status.url)')
          echo "========================================"
          echo "Staging deployed: $$URL"
          echo "========================================"
        else
          echo "Skipping staging deployment..."
        fi
    waitFor: ['push-image']

  # =========================================================================
  # Step 6: Run integration tests
  # =========================================================================
  - id: 'integration-tests'
    name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -d "tests" ]; then
          pip install httpx pytest -q
          echo "Running integration tests..."
          # pytest tests/integration/ -v || true
          echo "Tests completed"
        else
          echo "No tests directory, skipping..."
        fi
    waitFor: ['deploy-staging']

  # =========================================================================
  # Step 7: Deploy to Cloud Run (Production) - main branch only
  # =========================================================================
  - id: 'deploy-production'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$BRANCH_NAME" = "main" ] && [ -f "/workspace/image.txt" ]; then
          IMAGE=$(cat /workspace/image.txt)
          echo "Deploying to production..."
          gcloud run deploy ingestion-api \
            --image=$$IMAGE \
            --region=${_REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},BQ_DATASET_ID=sentrais_backbone,ENVIRONMENT=production,PUBSUB_TOPIC=sentrasignal-ingestion" \
            --min-instances=1 \
            --max-instances=100 \
            --memory=1Gi \
            --cpu=2 \
            --timeout=60s \
            --concurrency=80 \
            --service-account=ingestion-api@${PROJECT_ID}.iam.gserviceaccount.com

          # Get and display URL
          URL=$(gcloud run services describe ingestion-api --region=${_REGION} --format='value(status.url)')
          echo "========================================"
          echo "Production deployed: $$URL"
          echo "========================================"
        else
          echo "Skipping production deployment (not main branch or no image)"
        fi
    waitFor: ['integration-tests']

  # =========================================================================
  # Step 8: Summary
  # =========================================================================
  - id: 'summary'
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo ""
        echo "========================================"
        echo "BUILD COMPLETE"
        echo "========================================"
        echo "Branch: $BRANCH_NAME"
        echo "Commit: $SHORT_SHA"
        echo "Environment: $(cat /workspace/environment.txt)"
        echo "========================================"
    waitFor: ['deploy-production']

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Images to store in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ingestion-api:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ingestion-api:latest'

# Timeout for the entire build (30 minutes)
timeout: '1800s'
